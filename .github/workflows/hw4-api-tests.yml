name: Homework 4 API tests
on:
  push:
    paths:
      - 'homework/04-api-tests/**'
      - '.github/workflows/hw4-api-tests.yml'
  pull_request:
    paths:
      - 'homework/04-api-tests/**'
      - '.github/workflows/hw4-api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: homework/04-api-tests

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: homework/04-api-tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: homework/04-api-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Start pinned application
        run: python scripts/sut.py start
      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Generate Allure report
        if: always()
        run: npm run report
      - name: Save Docker logs
        if: always()
        run: python scripts/sut.py logs > docker.log 2>&1
      - name: Upload results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            homework/04-api-tests/allure-results/
            homework/04-api-tests/allure-report/
            homework/04-api-tests/test-results.xml
            homework/04-api-tests/docker.log
          retention-days: 14
      - name: Remove disposable environment
        if: always()
        run: python scripts/sut.py reset
